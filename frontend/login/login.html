<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Patela</title>
  <link rel="stylesheet" href="login.css" />
</head>
<body>
  <div id="app">

    <!-- Loading screen -->
    <section id="loading" class="screen loading">
      <div class="loading-brand-wrap">
        <div class="logo-mark">
          <svg viewBox="0 0 40 40" fill="none" width="48" height="48">
            <rect width="40" height="40" rx="12" fill="#10a37f"/>
            <path d="M12 28V12h8a6 6 0 1 1 0 12h-8" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="28" cy="26" r="3.5" fill="#ffffff"/>
          </svg>
        </div>
        <div class="brand">Patela</div>
      </div>
      <p class="loading-tagline">Fast. Cashless. Built for the community.</p>
      <div class="load-track"><div class="load-fill"></div></div>
    </section>

    <!-- Role selection -->
    <section id="roles" class="screen center hidden">
      <div class="roles-inner">
        <!-- Logo + Title -->
        <div class="brand-badge">
          <div class="logo-mark">
            <svg viewBox="0 0 40 40" fill="none" width="46" height="46">
              <rect width="40" height="40" rx="12" fill="#10a37f"/>
              <path d="M12 28V12h8a6 6 0 1 1 0 12h-8" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <circle cx="28" cy="26" r="3.5" fill="#ffffff"/>
            </svg>
          </div>
          <h1 class="brand-title">Patela</h1>
        </div>

        <p class="prompt">Choose how you want to continue</p>

        <!-- Clean, Modern Role Cards -->
        <div class="blocks">
          <button class="block" data-role="seller">
            <div class="block-header">
              <div class="block-icon seller-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26">
                  <path d="M3 7h18l-1.5 4.5a3 3 0 0 1-3 2.5H7.5a3 3 0 0 1-3-2.5L3 7z"/>
                  <path d="M3 7l1-3h16l1 3M6 14v6h12v-6"/>
                </svg>
              </div>
              <span class="card-pill seller-pill">Merchants</span>
            </div>
            <div class="block-body">
              <span class="block-label">Seller</span>
              <span class="block-sub">Accept instant QR payments and track daily revenue.</span>
            </div>
            <div class="block-footer">
              <span>Continue</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </div>
          </button>

          <button class="block" data-role="buyer">
            <div class="block-header">
              <div class="block-icon buyer-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="26" height="26">
                  <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4H6zM3 6h18M16 10a4 4 0 0 1-8 0"/>
                </svg>
              </div>
              <span class="card-pill buyer-pill">Shoppers</span>
            </div>
            <div class="block-body">
              <span class="block-label">Buyer</span>
              <span class="block-sub">Scan to pay spazas and explore local neighbourhood shops.</span>
            </div>
            <div class="block-footer">
              <span>Continue</span>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" width="16" height="16">
                <path d="M5 12h14M12 5l7 7-7 7"/>
              </svg>
            </div>
          </button>
        </div>
      </div>
    </section>

    <!-- Auth screen -->
    <section id="auth" class="screen center hidden">
      <div class="card">
        <div class="card-header">
          <button id="backBtn" class="back-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            Back
          </button>
          <div id="roleTag" class="role-tag"></div>
        </div>

        <h1 id="authTitle" class="title">Sign in</h1>

        <!-- Forms injected here -->
        <div id="formHost"></div>

        <p class="switch" id="switchLine"></p>
      </div>
    </section>

    <!-- Pull-up banner (seller business question) -->
    <div id="banner" class="overlay hidden">
      <div class="sheet">
        <div class="sheet-handle"></div>
        <button class="sheet-close" id="bannerClose">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M18 6 6 18M6 6l12 12"/>
          </svg>
        </button>
        <h2 class="sheet-title">Is your business registered?</h2>
        <p class="sheet-text">You can still use the platform even if it's not registered, as long as you provide a valid ID.</p>
        <div class="sheet-btns">
          <button class="sheet-yes" id="bizYes">Yes</button>
          <button class="sheet-no" id="bizNo">No</button>
        </div>
      </div>
    </div>

  </div>

  <script type="module" src="login.js"></script>
</body>
</html>
