<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Patela - Seller</title>

  <link
    rel="stylesheet"
    href="seller.css"
  />
</head>

<body>

  <div id="app">

    <!-- ========================================
         TOP BAR
    ========================================= -->

    <header class="topbar">

      <span class="brand">
        Patela
      </span>

      <div
        style="
          display:flex;
          align-items:center;
          gap:10px;
        "
      >

        <span class="role-chip">
          Seller
        </span>

        <button
          id="logoutBtn"
          type="button"
          title="Sign out"
          aria-label="Sign out"
          style="
            background:none;
            border:none;
            cursor:pointer;
            color:#e5484d;
            display:inline-flex;
            align-items:center;
            justify-content:center;
            padding:4px;
          "
        >

          <svg
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            width="18"
            height="18"
          >

            <path
              d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"
            />

          </svg>

        </button>

      </div>

    </header>


    <!-- ========================================
         MAIN SCREEN
    ========================================= -->

    <main
      id="screen"
      class="screen"
    ></main>


    <!-- ========================================
         BOTTOM NAVIGATION
    ========================================= -->

    <nav
      class="nav"
      id="nav"
      aria-label="Seller navigation"
    >

      <!-- Wallet -->

      <button
        class="nav-btn active"
        data-tab="wallet"
        type="button"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          width="22"
          height="22"
        >

          <path d="M20 12V8H6a2 2 0 0 1 0-4h12v4" />

          <path d="M4 6v12a2 2 0 0 0 2 2h14v-4" />

          <path d="M18 12a2 2 0 0 0 0 4h4v-4z" />

        </svg>

        <span>
          Wallet
        </span>

      </button>


      <!-- Activity -->

      <button
        class="nav-btn"
        data-tab="activity"
        type="button"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          width="22"
          height="22"
        >

          <path d="M22 12h-4l-3 9L9 3l-3 9H2" />

        </svg>

        <span>
          Activity
        </span>

      </button>


      <!-- Analytics -->

      <button
        class="nav-btn"
        data-tab="analytics"
        type="button"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          width="22"
          height="22"
        >

          <path d="M3 3v18h18" />

          <rect
            x="7"
            y="10"
            width="3"
            height="7"
          />

          <rect
            x="12"
            y="6"
            width="3"
            height="11"
          />

          <rect
            x="17"
            y="13"
            width="3"
            height="4"
          />

        </svg>

        <span>
          Analytics
        </span>

      </button>


      <!-- Map -->

      <button
        class="nav-btn"
        data-tab="map"
        type="button"
      >

        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          width="22"
          height="22"
        >

          <path
            d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"
          />

          <circle
            cx="12"
            cy="10"
            r="3"
          />

        </svg>

        <span>
          Map
        </span>

      </button>

    </nav>

  </div>


  <!-- ========================================
       CHART.JS
  ========================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"
  ></script>


  <!-- ========================================
       QR CODE
  ========================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"
  ></script>


  <!-- ========================================
       GOOGLE MAPS

       Put your existing restricted Google
       Maps browser key below.
  ========================================= -->

  <script
    src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY&libraries=visualization"
  ></script>


  <!-- ========================================
       PDF GENERATION
  ========================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"
  ></script>

  <script
    src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"
  ></script>


  <!-- ========================================
       SELLER APPLICATION
  ========================================= -->

  <script
    type="module"
    src="seller.js"
  ></script>

</body>

</html>
